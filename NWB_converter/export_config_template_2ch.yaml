# NWB export config for NWBExporter. Copy and edit for each export.
# Usage: NWBExporter(prefix, 'path/to/this.yaml').run()

output:
  directory: E:/NWB_export/
  filename: "{prefix}.nwb"   # {prefix} is replaced with the session prefix
  overwrite: false

session:
  procpath: null             # null: look up Processed.Path in the DB
  use_db: true               # look up the session in the DB (for procpath and db_entry)
  imaging_session_kwargs:    # passed to ImagingSession
    tag: CellsRe             # there can be multiple tags exported, specify one here that we can use for exporting
    lfp_ch: 1

nwbfile:
  lab: LNCM
  institution: BCM
  experimenter:              # "Last, First"; experimenters from export_metadata() are added
    - Dudok, Barna
  session_description: null  # null: use the prefix
  experiment_description: 2P ImagingSession
  keywords: [LNCM, 2P, CA1, jRGECO1a]
  related_publications: []   # e.g. doi:10.1016/j.neuron.2016.12.011

subject:                     # pynwb Subject fields; override the values from export_metadata()
  species: Mus musculus

imaging:
  brain_region: CA1
  excitation_lambda: null    # nm; null: take from export_metadata()
  device:
    name: Bruker Investigator
    model_name: Bruker Ultima Investigator Plus
    description: Two-photon microscope for in vivo imaging
    manufacturer: Bruker
    model_number: Ultima Investigator Plus
    serial_number: SN-4988
  channels:                  # in the order of the channels returned by export_2p_movie and export_traces
    - name: Ch1_Red
      description: Red fluorescence channel
      emission_lambda: 595.0
      indicator: jRGECO1a
    - name: Ch2_Green
      description: Green fluorescence channel
      emission_lambda: 525.0
      indicator: GCaMP8m

lfp:
  location: CA1 (contralateral)
  description: LFP recording
  device_name: A-M Systems Model 300
  device_description: twisted wire pair, differential amplifier, 1000x gain
  filtering: [0.1 1000]
  reference: null

include:                     # frame times are always included
  fov_image: true
  2p_movie: true
  speed: true
  abspos: true
  lfp: false
  video: true

roi_sets:
  - tag: CellsRe
    source: S2P # one of valid registered source names ['S2P', 'GEVIReg', 'Raw']
    weighted: false # whether to use snr-weighted or binary masks. check this matches what's recorded in the processing log.
    # when available from metadata, this option is ignored
    description: All GECO-expressing PCs segmented
    traces:                  # trace tags; either a str, or a dict with tag, description and unit
      - tag: trace
        description: raw fluorescence
        unit: F
      - tag: rel
        description: DF/F
        unit: dfof


point_events: []             # e.g. [licks, rewards]
interval_events: []          # e.g. [seizures]

compression:
  2p_movie: 4                # gzip level, 0 for no compression
  video: 4
  buffer_frames: 100         # frames written at a time
