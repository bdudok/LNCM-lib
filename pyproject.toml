# Environment definition for the lncm env (uv). Setup steps: installation.md
# LNCM-lib is not installed as a package; scripts add the repo to the path as before.
[project]
name = "lncm-lib"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=2",
    "scipy",
    "pandas",
    "pyarrow",
    "h5py",
    "numba",
    "scikit-image>=0.25",
    "scikit-learn",
    "statsmodels",
    "pygam",
    "opencv-python",
    "tifffile>=2025",
    "shapely",
    "lsq-ellipse",
    "pyedflib",
    "pynwb",
    "openpyxl",
    "xlrd",
    "jinja2",
    "requests",
    "matplotlib",
    "PySide6",
    "jupyter",
    "pytest",
    "pandas-stubs",
    "scipy-stubs",
    # motion correction (Proc2P/Analysis/S2P_template)
    # without suite2p[gui]: its PyQt6 ships Qt DLLs with the same names as PySide6's, and only one set can load per process
    "suite2p==1.1.0",
    "torch",
    "torchvision",
]

[dependency-groups]
# installed by uv sync by default
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["_Dependencies"]

[tool.ruff.lint]
# bugs only (pyflakes, syntax errors, statement checks, a few bugbear rules), no style rules;
# meant for changed files, not the whole repo
select = ["F", "E9", "E7", "B006", "B033", "B011"]

[tool.ruff.lint.per-file-ignores]
# package __init__ files import names for re-export
"__init__.py" = ["F401"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# cellpose requires opencv-python-headless, which installs the same cv2 module as opencv-python
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
